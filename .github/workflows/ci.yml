name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -r requirements.txt
      - run: pip check
      - run: python -m compileall -q apps scripts tests
      - run: pytest -q
      - run: python scripts/smoke.py
      - run: python scripts/check_static.py
      - run: python scripts/cleanup_sessions.py --dry-run --max-sessions 100
      - run: node --check apps/web/app.js

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: learning-agent:ci
      - name: Docker runtime smoke
        run: |
          set -euo pipefail
          docker run -d --name learning-agent-ci -p 18000:8000 learning-agent:ci
          trap 'docker logs learning-agent-ci || true; docker rm -f learning-agent-ci >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18000/api/v1/ready >/tmp/ready.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"
          grep -q '"status":"ok"' /tmp/ready.json
          curl -fsS http://127.0.0.1:18000/api/v1/live | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:18000/ | grep -q '文科实验室'
          curl -fsS -X POST http://127.0.0.1:18000/api/v1/session/start >/tmp/session.json
          grep -q '"session_token"' /tmp/session.json
          docker exec learning-agent-ci python scripts/cleanup_sessions.py --dry-run --max-sessions 100 | grep -q '"dry_run": true'
